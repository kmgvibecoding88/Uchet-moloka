<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Учёт выдачи молока</title>
<style>
:root{
  --brand:#1F3A5F;--brand-2:#2B4E7E;--bg:#FFFFFF;--panel:#F4F6F8;--line:#DDE2E8;--text:#1A1A1A;--muted:#5F6B7A;
  --ok:#2E7D32;--work:#1565C0;--sick:#C62828;--nopass:#EF6C00;--gray:#757575;--manual:#6A1B9A;
  --warn-bg:#FFF4E5;--err-bg:#FDECEA;--ok-bg:#E8F5E9;--info-bg:#E8F0FA;--manual-bg:#F3E5F5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}
a{color:var(--work)}

/* demo bar */
.demobar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:6px 20px;background:#FFF8E1;border-bottom:1px solid #F0E2B6;font-size:13px;color:#5D4A12}
.demobar label{display:flex;align-items:center;gap:6px}
.demobar select,.demobar input{height:28px;padding:0 6px;border:1px solid #D9C88F;border-radius:4px;background:#fff;font-size:13px}
.demobar .sp{flex:1}
.demobar button{height:28px;padding:0 10px;border:1px solid #D9C88F;border-radius:4px;background:#fff;cursor:pointer;font-size:13px}

/* header */
.top{background:var(--brand);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:12px 20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:6px;background:#fff;display:grid;place-items:center;flex:none}
.brand h1{font-size:19px;white-space:nowrap}
.brand small{display:block;font-size:12px;opacity:.75;font-weight:400}
.top .sp{flex:1}
.hinfo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;font-size:14px}
.daybadge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:4px;font-weight:600;font-size:13px;letter-spacing:.02em}
.daybadge.yes{background:#fff;color:var(--ok)}
.daybadge.no{background:rgba(255,255,255,.15);color:#fff}
.daybadge.hol{background:#FDECEA;color:var(--sick)}
.daybadge i{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
.skud{display:inline-flex;align-items:center;gap:6px}
.skud.stale{color:#FFCC80;font-weight:600}
.iconbtn{height:34px;min-width:34px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:6px;cursor:pointer;font-size:16px;padding:0 8px}
.iconbtn:hover{background:rgba(255,255,255,.12)}
.user{text-align:right;line-height:1.25}
.user b{display:block;font-weight:600}
.user span{font-size:12px;opacity:.8}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:6px;overflow:hidden}
.lang button{height:34px;padding:0 10px;border:0;background:transparent;color:#fff;cursor:pointer;font-size:13px;font-weight:600}
.lang button.on{background:#fff;color:var(--brand)}

nav.tabsnav{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff;overflow-x:auto}
nav.tabsnav a{display:block;padding:12px 16px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabsnav a.on{color:var(--brand);border-bottom-color:var(--brand)}
nav.tabsnav a:hover{color:var(--brand)}

main{max-width:1320px;margin:0 auto;padding:20px}

/* controls */
.btn{min-height:40px;padding:0 16px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#B8C1CC}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn-issue{background:var(--work);border-color:var(--work);color:#fff;min-width:110px}
.btn-issue:hover{background:#0D5BAF;border-color:#0D5BAF}
.btn-manual{background:var(--manual);border-color:var(--manual);color:#fff;min-width:110px}
.btn-danger{background:var(--sick);border-color:var(--sick);color:#fff}
.btn:disabled,.btn[disabled]{background:#E9ECEF;border-color:#E9ECEF;color:#9AA3AE;cursor:not-allowed}
.btn-sm{min-height:32px;padding:0 10px;font-size:13px}
.input,select.input{height:40px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;min-width:0}
textarea.input{height:auto;padding:8px 12px;resize:vertical}
.input:focus,.btn:focus-visible,.combo-btn:focus-visible{outline:2px solid #90B4E8;outline-offset:1px}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:13px;color:var(--muted);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.muted{color:var(--muted)}
.small{font-size:13px}

.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
.toolbar .grow{flex:1 1 320px}

/* combo */
.combo{position:relative;min-width:0}
.combo-btn{width:100%;height:40px;padding:0 36px 0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.combo-btn::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.combo-panel{position:absolute;z-index:20;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(16,32,56,.14);padding:8px}
.combo-panel .input{width:100%}
.combo-list{max-height:340px;overflow:auto;margin-top:6px}
.combo-item{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:4px;cursor:pointer}
.combo-item:hover,.combo-item.on{background:var(--info-bg)}
.combo-item.on{font-weight:600}

/* counters */
.counters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.counter{background:var(--panel);border-radius:6px;padding:10px 14px;border-left:4px solid var(--line)}
.counter b{display:block;font-size:24px;font-weight:600;line-height:1.2}
.counter span{font-size:13px;color:var(--muted)}
.counter.c-work{border-left-color:var(--work)}
.counter.c-ok{border-left-color:var(--ok)}
.counter.c-left{border-left-color:var(--brand)}
.counter.c-abs{border-left-color:var(--gray)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:18px;background:#fff;cursor:pointer;font-weight:600;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip em{font-style:normal;opacity:.75;margin-left:4px}

/* banners */
.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 16px;border-radius:6px;margin-bottom:14px;border-left:4px solid}
.banner b{font-weight:600}
.banner .sp{flex:1}
.banner.warn{background:var(--warn-bg);border-color:var(--nopass)}
.banner.err{background:var(--err-bg);border-color:var(--sick)}
.banner.info{background:var(--info-bg);border-color:var(--work)}
.banner.manual{background:var(--manual-bg);border-color:var(--manual)}
.banner.ok{background:var(--ok-bg);border-color:var(--ok)}

/* tables */
.tablewrap{border:1px solid var(--line);border-radius:6px;overflow-x:auto;background:#fff}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--panel);font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;position:sticky;top:0}
tbody tr:hover{background:#FAFBFC}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
.tabno{font-variant-numeric:tabular-nums;color:var(--muted)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--brand)}
th .arr{font-size:11px;margin-left:3px}
tr.group td{background:#EEF2F6;font-weight:600;color:var(--brand)}
tr.subtotal td{background:#F8FAFB;font-weight:600}
tr.total td{background:var(--brand);color:#fff;font-weight:600}
tr.clickable{cursor:pointer}

.status{display:inline-flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}
.status i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.status small{font-weight:400;color:var(--muted);margin-left:2px}
.done{display:inline-flex;align-items:center;gap:8px;color:var(--ok);font-weight:600;white-space:nowrap}
.done .ck{width:28px;height:28px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:16px}
.actcell{display:flex;align-items:center;gap:8px;justify-content:flex-start}
.menu-btn{width:32px;height:32px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:16px;line-height:1}
.popmenu{position:absolute;z-index:40;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(16,32,56,.16);padding:4px;min-width:200px}
.popmenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;cursor:pointer;border-radius:4px}
.popmenu button:hover{background:var(--err-bg);color:var(--sick)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;background:var(--panel);color:var(--muted);white-space:nowrap}
.tag.manual{background:var(--manual-bg);color:var(--manual)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.err{background:var(--err-bg);color:var(--sick)}
.tag.warn{background:var(--warn-bg);color:var(--nopass)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.sectiontitle{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:22px 0 10px}
.sectiontitle h2{font-size:17px}

/* cards & admin */
.page-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:16px}
.page-h h2{font-size:20px}
.page-h .sp{flex:1}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
.card h3{font-size:16px;margin-bottom:12px}
.panel{background:var(--panel);border-radius:6px;padding:14px 16px;margin-bottom:16px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px}
.sidenav{display:flex;flex-direction:column;gap:2px}
.sidenav a{padding:10px 12px;border-radius:6px;text-decoration:none;color:var(--text);font-weight:600}
.sidenav a.on{background:var(--brand);color:#fff}
.sidenav a:not(.on):hover{background:var(--panel)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.integ{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.integ .card{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:10px 0 14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.tree label{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--panel)}
.tree input{width:18px;height:18px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.checks label.on{border-color:var(--brand);background:var(--info-bg)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:100;overflow:auto}
.dialog{background:#fff;border-radius:8px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dialog.wide{max-width:900px}
.dlg-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-h h3{font-size:17px;flex:1}
.dlg-h .x{width:36px;height:36px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
.dlg-b{padding:16px 20px}
.dlg-f{display:flex;justify-content:flex-end;gap:10px;padding:12px 20px 18px}
.err-text{color:var(--sick);font-size:13px;min-height:18px}

.toast{position:fixed;right:20px;bottom:20px;z-index:200;background:#1A1A1A;color:#fff;padding:12px 16px;border-radius:6px;max-width:380px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--sick)}

.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13px;color:var(--muted)}
footer{max-width:1320px;margin:0 auto;padding:8px 20px 28px;font-size:12px;color:var(--muted)}

@media (max-width:1000px){
  .counters{grid-template-columns:repeat(3,minmax(0,1fr))}
  .layout{grid-template-columns:1fr}
  .sidenav{flex-direction:row;flex-wrap:wrap}
  .integ,.grid2{grid-template-columns:1fr}
}
@media (max-width:640px){
  main{padding:16px}
  .top,.demobar,nav.tabsnav{padding-left:16px;padding-right:16px}
  .counters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .user{text-align:left}
  .brand h1{font-size:17px;white-space:normal}
}
</style>
</head>
<body>
<div class="demobar" id="demobar"></div>
<header class="top" id="top"></header>
<nav class="tabsnav" id="nav"></nav>
<main id="main"></main>
<footer>Прототип по PRD «Веб-система учёта выдачи молока сотрудникам», v1.3. Данные СКУД, 1С/HR и AD сымитированы; изменения сохраняются в этом браузере.</footer>

<script>
(function(){
'use strict';

/* ================= utils ================= */
const pad=n=>String(n).padStart(2,'0');
function realToday(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dn(s){const[y,m,d]=s.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/864e5)}
function fromDn(n){const d=new Date(n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function addDays(s,k){return fromDn(dn(s)+k)}
function wd(s){return (dn(s)+4)%7} /* 0 = Вс */
function fmtD(s){if(!s)return '';const[y,m,d]=s.split('-');return d+'.'+m+'.'+y}
function hm(min){return pad(Math.floor(min/60))+':'+pad(min%60)}
function nowHM(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function stamp(){const d=new Date();return realToday()+' '+nowHM()+':'+pad(d.getSeconds())}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function liters(v){return (Math.round(v*10)/10).toLocaleString('ru-RU',{minimumFractionDigits:1,maximumFractionDigits:1})}
function hash(){const s=Array.prototype.join.call(arguments,'|');let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  return (h1>>>0)/4294967296}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const $=(sel,root)=>(root||document).querySelector(sel);
const $$=(sel,root)=>Array.from((root||document).querySelectorAll(sel));

const I18N={
 ru:{app:'Учёт выдачи молока',sub:'Центральное управление',navIssue:'Выдача',navReport:'Отчёт',navAdmin:'Администрирование',

  dept:'Подразделение',search:'Поиск по ФИО или таб. №',total:'Всего',atWork:'На работе',issued:'Выдано',left:'Осталось выдать',absent:'Отсутствуют',all:'Все',
  tab:'Таб. №',fio:'ФИО',pos:'Должность',status:'Статус',pass:'Проход',action:'Выдача',give:'Выдать',cancelIssue:'Отменить выдачу',
  st_work:'На работе',st_sick:'Больничный',st_vacation:'Отпуск',st_trip:'Командировка',st_other:'Прочее отсутствие',st_nopass:'Нет прохода',st_manual:'По ручному списку',st_issued:'Молоко выдано',
  role_storekeeper:'Кладовщик',role_admin:'Администратор',role_viewer:'Наблюдатель',empty:'Нет сотрудников по выбранным условиям',otherDepts:'Найдено в других подразделениях',
  wd:['Вс','Пн','Вт','Ср','Чт','Пт','Сб']},
 kz:{app:'Сүт беруді есепке алу',sub:'Орталық басқару',navIssue:'Беру',navReport:'Есеп',navAdmin:'Әкімшілендіру',
  issueDay:'СҮТ БЕРУ КҮНІ',noIssueDay:'СҮТ БЕРУ КҮНІ ЕМЕС',holiday:'МЕРЕКЕ КҮНІ',skudUpd:'СКУД жаңартылды',refresh:'СКУД деректерін жаңарту',
  dept:'Бөлімше',search:'Аты-жөні немесе таб. № бойынша іздеу',total:'Барлығы',atWork:'Жұмыста',issued:'Берілді',left:'Беру қалды',absent:'Жоқ',all:'Бәрі',
  tab:'Таб. №',fio:'Аты-жөні',pos:'Лауазымы',status:'Мәртебесі',pass:'Өту',action:'Беру',give:'Беру',cancelIssue:'Беруді болдырмау',
  st_work:'Жұмыста',st_sick:'Ауруы бойынша',st_vacation:'Демалыс',st_trip:'Іссапар',st_other:'Басқа себеп',st_nopass:'Өту жоқ',st_manual:'Қолмен тізім бойынша',st_issued:'Сүт берілді',
  role_storekeeper:'Қойма меңгерушісі',role_admin:'Әкімші',role_viewer:'Бақылаушы',empty:'Таңдалған шарттар бойынша қызметкерлер жоқ',otherDepts:'Басқа бөлімшелерде табылды',
  wd:['Жс','Дс','Сс','Ср','Бс','Жм','Сн']}
};
function t(k){return (I18N[S.lang]&&I18N[S.lang][k])||I18N.ru[k]||k}

];
const DMAP=Object.fromEntries(DEPTS.map(d=>[d.id,d]));
const SIZES={'fin-acc':14,'fin-eco':10,'hr-staff':9,'hr-edu':6,'law':8,'it-inf':11,'it-dev':12,'hse':9,'adm':7};
const POS={
 'fin-acc':['Начальник отдела','Бухгалтер','Ведущий бухгалтер','Главный специалист','Бухгалтер-кассир'],
 'fin-eco':['Начальник отдела','Экономист','Ведущий экономист','Главный специалист'],
 'hr-staff':['Начальник отдела','Специалист по кадрам','Ведущий специалист','Инспектор по кадрам'],

/* ================= бизнес-логика ================= */
function children(id){return DEPTS.filter(d=>d.parent===id)}
function descendants(id){const out=[id];for(const c of children(id))out.push(...descendants(c.id));return out}
function depth(id){let n=0,d=DMAP[id];while(d&&d.parent){n++;d=DMAP[d.parent]}return n}
function eligible(id){let d=DMAP[id];while(d){if(!S.eligible[d.id])return false;d=DMAP[d.parent]}return true}
function deptPath(id){const p=[];let d=DMAP[id];while(d&&d.parent){p.unshift(d.name);d=DMAP[d.parent]}return p.length?'ЦУ / '+p.join(' / '):'Центральное управление (все подразделения)'}
function empsIn(id){const set=new Set(descendants(id));return EMPS.filter(e=>set.has(e.dept)&&eligible(e.dept))}

function settingFor(date){const arr=S.settings.slice().sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:0);let r=arr[0];for(const s of arr)if(s.from<=date)r=s;return r}
function holidayOf(date){return S.holidays.find(h=>h.date===date)||null}
function isIssueWeekday(date){return settingFor(date).days.includes(wd(date))}
function isIssueDay(date){return isIssueWeekday(date)&&!holidayOf(date)}
function dayKind(date){if(holidayOf(date))return isIssueWeekday(date)?'holiday':'holidayNo';return isIssueWeekday(date)?'issue':'no'}
function daysLabel(days){const n=['вс','пн','вт','ср','чт','пт','сб'];return days.slice().sort().map(d=>n[d]).join(', ')}

function absenceOf(e,date){
 const n=dn(date);
 const blk=(tag,L,p)=>{const off=e.off%L;const b=Math.floor((n+off)/L);if(hash(e.id,tag,b)<p){const s=b*L-off;return{from:fromDn(s),to:fromDn(s+L-1)}}return null};
 let r;
 if((r=blk('v',14,0.06)))return Object.assign({kind:'vacation'},r);
 if((r=blk('s',6,0.04)))return Object.assign({kind:'sick'},r);
 if((r=blk('t',4,0.035)))return Object.assign({kind:'trip'},r);
 if(hash(e.id,'o',n)<0.015)return{kind:'other',from:date,to:date};
 return null;
}
function passOf(e,date){
 const w=wd(date);if(w===0||w===6)return null;
 const n=dn(date);if(hash(e.id,'np',n)<0.05)return null;
 const m=7*60+40+Math.floor(hash(e.id,'tm',n)*100);
 if(date===realToday()&&m>nowMin())return null;
 return m;
}
function emergencyFor(e,date){return S.emergencies.find(x=>x.date===date&&(date<today()||!x.off)&&descendants(x.scope).includes(e.dept))||null}
function statusOf(e,date){
 const ab=absenceOf(e,date),p=passOf(e,date),em=emergencyFor(e,date);
 let code;if(ab)code=ab.kind;else if(em)code='manual';else if(p!=null)code='work';else code='nopass';
 return{code:code,ab:ab,pass:p,em:em,issue:issueOf(e.id,date)};
}
const COLORS={work:'var(--work)',manual:'var(--manual)',sick:'var(--sick)',vacation:'var(--gray)',trip:'var(--gray)',other:'var(--gray)',nopass:'var(--nopass)',issued:'var(--ok)'};
function statusHtml(s){
 let extra='';if(s.ab)extra=s.ab.from===s.ab.to?'':'<small>до '+fmtD(s.ab.to).slice(0,5)+'</small>';
 return '<span class="status" style="color:'+COLORS[s.code]+'"><i style="background:'+COLORS[s.code]+'"></i>'+esc(t('st_'+s.code))+extra+'</span>';
}

 const u=user();const d=today();

 if(s.issue)return{ok:false,reason:'Молоко уже выдано в '+s.issue.time};
 const k=dayKind(d);
 if(k==='holiday'||k==='holidayNo')return{ok:false,reason:'Праздничный/нерабочий день ('+holidayOf(d).name+') — выдача не производится и не переносится'};
 if(k==='no')return{ok:false,reason:'Сегодня не день выдачи. Дни выдачи: '+daysLabel(settingFor(d).days)};
 if(s.ab){const nm={sick:'Больничный',vacation:'Отпуск',trip:'Командировка',other:'Прочее отсутствие'}[s.code];return{ok:false,reason:nm+' по данным 1С/HR ('+fmtD(s.ab.from)+' – '+fmtD(s.ab.to)+'). Отсутствие имеет приоритет над СКУД — выдача запрещена'}}
 if(s.code==='nopass')return{ok:false,reason:'Нет прохода на вход по СКУД сегодня (в т. ч. если сотрудник забыл пропуск) — выдача запрещена'};
 return{ok:true};
}

function modal(title,body,actions,wide){

 ov.innerHTML='<div class="dialog'+(wide?' wide':'')+'" role="dialog" aria-modal="true"><div class="dlg-h"><h3>'+esc(title)+'</h3><button class="x" aria-label="Закрыть">×</button></div><div class="dlg-b">'+body+'</div><div class="dlg-f"></div></div>';
 const close=()=>{ov.remove();document.removeEventListener('keydown',onKey)};
 const onKey=e=>{if(e.key==='Escape')close()};
 document.addEventListener('keydown',onKey);
 ov.addEventListener('mousedown',e=>{if(e.target===ov)close()});
 $('.x',ov).onclick=close;
 const f=$('.dlg-f',ov);
 (actions||[{label:'Закрыть',cls:''}]).forEach(a=>{const b=document.createElement('button');b.className='btn '+(a.cls||'');b.textContent=a.label;b.onclick=()=>{if(a.onClick){if(a.onClick(ov,close)!==false)close()}else close()};f.appendChild(b)});
 document.body.appendChild(ov);
 const first=$('input,textarea,select',ov);if(first)first.focus();
 return ov;
}

function monthRange(off){const d=new Date(today()+'T00:00:00');d.setDate(1);d.setMonth(d.getMonth()+off);const y=d.getFullYear(),m=d.getMonth();const last=new Date(y,m+1,0).getDate();return[y+'-'+pad(m+1)+'-01',y+'-'+pad(m+1)+'-'+pad(last)]}
function reportFilter(){if(!S.report){const r=monthRange(0);S.report={from:r[0],to:r[1],dept:'cu',q:'',manual:false}}return S.report}
const REASONS=[['sick','Больн.'],['vacation','Отпуск'],['trip','Команд.'],['other','Прочее'],['nopass','Нет прохода'],['notTaken','На работе, не получил']];
function reportData(f){
 const days=[],excluded=[];const end=f.to<today()?f.to:today();
 if(f.from&&f.to)for(let d=f.from;d<=end;d=addDays(d,1)){if(isIssueWeekday(d)){if(holidayOf(d))excluded.push(d);else days.push(d)}}
 let emps=eligible(f.dept)?empsIn(f.dept):[];const q=(f.q||'').trim().toLowerCase();
 if(q)emps=emps.filter(e=>e.fio.toLowerCase().includes(q)||e.tab.includes(q));
 let rows=emps.map(e=>{const r={e:e,days:days.length,issued:0,vol:0,manual:0,sick:0,vacation:0,trip:0,other:0,nopass:0,notTaken:0};
  for(const d of days){const i=issueOf(e.id,d);if(i){r.issued++;r.vol+=i.vol;if(i.basis==='manual')r.manual++}else{const s=statusOf(e,d);const k=['sick','vacation','trip','other','nopass'].includes(s.code)?s.code:'notTaken';r[k]++}}
  return r});
 if(f.manual)rows=rows.filter(r=>r.manual>0);
 return{days:days,excluded:excluded,rows:rows};
}

 const val=(r,k)=>k==='tab'?+r.e.tab:k==='fio'?r.e.fio:k==='pos'?r.e.pos:r[k];

 const groups=[];for(const d of DEPTS){const g=R.rows.filter(r=>r.e.dept===d.id);if(g.length)groups.push([d,g.sort(cmp)])}

 if(!R.rows.length){$('#rOut').innerHTML=html+'<div class="tablewrap"><div class="empty">Нет данных по выбранным фильтрам</div></div>';return}
 html+='<div class="tablewrap" style="max-height:70vh;overflow:auto"><table><thead><tr>'+cols.map(c=>'<th class="sortable '+c[2]+'" data-sort="'+c[0]+'">'+esc(c[1])+(so.key===c[0]?'<span class="arr">'+(so.dir>0?'▲':'▼')+'</span>':'')+'</th>').join('')+'</tr></thead><tbody>';
 for(const [d,g] of groups){
  html+='<tr class="group"><td colspan="'+cols.length+'">'+esc(deptPath(d.id))+'</td></tr>';
  html+=g.map(r=>'<tr class="clickable" data-emp="'+r.e.id+'" title="Открыть детальный вид"><td class="tabno">'+r.e.tab+'</td><td><a href="javascript:void 0">'+esc(r.e.fio)+'</a></td><td class="small">'+esc(r.e.pos)+'</td>'+numCells(r)+'</tr>').join('');

 '<p class="muted small">Нажмите на сотрудника, чтобы открыть детальный вид. Отменённые выдачи в отчёт не попадают. Сформировано за '+Math.max(1,Math.round(performance.now()-t0))+' мс.</p>';

  const em={id:'m'+(S.seq++),date:d,scope:scope,listNo:no,listDate:ld,manager:mgr,file:f?f.name:'',by:user().name,on:stamp().slice(0,16),off:null};
  S.emergencies.push(em);log('Включение аварийного режима',scope==='cu'?'Все подразделения ЦУ':DMAP[scope].name,'','Список №'+no+' от '+fmtD(ld)+', рук. '+mgr+(em.file?', скан: '+em.file:''));save();render();toast('Аварийный режим включён','ok')};
 bindEmOff();
}
function emTable(list,active){
 if(!list.length)return '<div class="tablewrap"><div class="empty">Нет записей</div></div>';
 return '<div class="tablewrap"><table><thead><tr><th>Дата</th><th>Подразделение</th><th>Список</th><th>Руководитель</th><th>Скан</th><th>Включил</th><th>Период</th><th></th></tr></thead><tbody>'+
 list.map(x=>'<tr><td>'+fmtD(x.date)+'</td><td>'+esc(x.scope==='cu'?'Все подразделения ЦУ':DMAP[x.scope].name)+'</td><td>№ '+esc(x.listNo)+' от '+fmtD(x.listDate)+'</td><td>'+esc(x.manager)+'</td><td>'+(x.file?esc(x.file):'<span class="muted">—</span>')+'</td><td>'+esc(x.by)+'</td><td>'+esc(x.on.slice(11))+' – '+(x.off?esc(x.off.slice(11)):'<span class="tag manual">активен</span>')+'</td><td>'+(active?'<button class="btn btn-sm" data-off="'+x.id+'">Выключить</button>':'')+'</td></tr>').join('')+'</tbody></table></div>';
}
function bindEmOff(){$$('[data-off]').forEach(b=>b.onclick=()=>{const x=S.emergencies.find(e=>e.id===b.dataset.off);
 modal('Выключить аварийный режим?','<p>Выдачи, сделанные по ручному списку № '+esc(x.listNo)+', сохранятся и не будут пересчитаны.</p>',[{label:'Отмена'},{label:'Выключить',cls:'btn-primary',onClick:()=>{x.off=stamp().slice(0,16);log('Выключение аварийного режима',x.scope==='cu'?'Все подразделения ЦУ':DMAP[x.scope].name,'включён','выключен');save();render();toast('Аварийный режим выключен')}}])})}

function admSettings(){
 const cur=settingFor(today());const tm=addDays(today(),1);const names=['Пн','Вт','Ср','Чт','Пт'];
 $('#adm').innerHTML='<div class="page-h"><h2>Дни выдачи и норма</h2></div>'+
 '<div class="panel">Действует сейчас: <b>'+daysLabel(cur.days)+'</b>, норма <b>'+liters(cur.norm)+' л</b> на сотрудника за выдачу (с '+fmtD(cur.from)+').</div>'+
 '<div class="card"><h3>Новые параметры</h3><div class="field" style="margin-bottom:12px"><span>Дни выдачи (ровно 2)</span><div class="checks">'+names.map((n,i)=>'<label class="'+(cur.days.includes(i+1)?'on':'')+'"><input type="checkbox" value="'+(i+1)+'"'+(cur.days.includes(i+1)?' checked':'')+'> '+n+'</label>').join('')+'</div></div>'+
 '<div class="row"><label class="field"><span>Норма, л</span><input class="input" type="number" step="0.1" min="0.1" max="5" id="sNorm" value="'+cur.norm+'" style="width:120px"></label>'+
 '<label class="field"><span>Действует с</span><input class="input" type="date" id="sFrom" value="'+tm+'" min="'+tm+'"></label><button class="btn btn-primary" id="sSave">Сохранить</button></div><div class="err-text" id="sErr"></div></div>'+
 '<div class="sectiontitle"><h2>История изменений</h2></div><div class="tablewrap"><table><thead><tr><th>Действует с</th><th>Дни</th><th class="num">Норма, л</th><th>Кто изменил</th><th>Когда</th></tr></thead><tbody>'+
 S.settings.slice().sort((a,b)=>a.from<b.from?1:-1).map(s=>'<tr><td>'+fmtD(s.from)+'</td><td>'+daysLabel(s.days)+'</td><td class="num">'+liters(s.norm)+'</td><td>'+esc(s.by)+'</td><td>'+esc(s.ts.slice(0,16))+'</td></tr>').join('')+'</tbody></table></div>';
 $$('#adm .checks input').forEach(c=>c.onchange=()=>c.parentNode.classList.toggle('on',c.checked));
 $('#sSave').onclick=()=>{const days=$$('#adm .checks input:checked').map(c=>+c.value);const norm=parseFloat($('#sNorm').value);const from=$('#sFrom').value;
  if(days.length!==2){$('#sErr').textContent='Выберите ровно два дня недели';return}
  if(!(norm>0)){$('#sErr').textContent='Укажите норму больше 0';return}
  if(!from||from<=today()){$('#sErr').textContent='Дата начала действия — не раньше завтрашнего дня';return}
  const old=settingFor(from);S.settings=S.settings.filter(s=>s.from!==from);
  S.settings.push({from:from,days:days,norm:norm,by:user().name,ts:stamp()});
  log('Изменение настроек выдачи','Дни и норма с '+fmtD(from),daysLabel(old.days)+'; '+liters(old.norm)+' л',daysLabel(days)+'; '+liters(norm)+' л');save();render();toast('Настройки сохранены','ok')};
}
function admDepts(){
 $('#adm').innerHTML='<div class="page-h"><h2>Подразделения с правом на молоко</h2></div><p class="muted" style="margin-top:0">Структура загружается из 1С/HR. Снятая отметка у подразделения скрывает его и все вложенные из выдачи и отчёта.</p>'+
 '<div class="card tree">'+DEPTS.map(d=>{const n=empsIn(d.id).length;return '<label style="padding-left:'+depth(d.id)*26+'px"><input type="checkbox" data-d="'+d.id+'"'+(S.eligible[d.id]?' checked':'')+'><span>'+esc(d.name)+'</span><span class="muted small">'+(eligible(d.id)?n+' сотр.':'нет права')+'</span></label>'}).join('')+'</div>';
 $$('#adm [data-d]').forEach(c=>c.onchange=()=>{const id=c.dataset.d;S.eligible[id]=c.checked;log('Изменение перечня подразделений',DMAP[id].name,c.checked?'нет права':'право на молоко',c.checked?'право на молоко':'нет права');save();admDepts()});
}
function admCalendar(){
 const y=+today().slice(0,4);
 const list=S.holidays.slice().sort((a,b)=>a.date<b.date?-1:1);
 $('#adm').innerHTML='<div class="page-h"><h2>Производственный календарь</h2><span class="sp"></span><button class="btn" id="cLoad">Загрузить '+(y+1)+' год</button></div>'+
 '<p class="muted" style="margin-top:0">В праздничные и нерабочие дни выдача не производится и не переносится; такие дни не считаются днями выдачи в отчёте.</p>'+
 '<div class="card"><h3>Добавить день</h3><div class="row"><label class="field"><span>Дата</span><input class="input" type="date" id="cDate"></label><label class="field" style="flex:1 1 220px"><span>Наименование</span><input class="input" id="cName" placeholder="Например: перенос выходного"></label>'+
 '<label class="field"><span>Признак</span><select class="input" id="cKind"><option>Праздник</option><option>Нерабочий день</option></select></label><button class="btn btn-primary" id="cAdd">Добавить</button></div><div class="err-text" id="cErr"></div></div>'+
 '<div class="tablewrap"><table><thead><tr><th>Дата</th><th>День</th><th>Наименование</th><th>Признак</th><th>Совпадает с днём выдачи</th><th></th></tr></thead><tbody>'+
 list.map(h=>'<tr><td>'+fmtD(h.date)+'</td><td>'+I18N.ru.wd[wd(h.date)]+'</td><td>'+esc(h.name)+'</td><td>'+esc(h.kind)+'</td><td>'+(isIssueWeekday(h.date)?'<span class="tag warn">да — выдачи нет</span>':'<span class="muted">нет</span>')+'</td><td><button class="btn btn-sm" data-del="'+h.date+'">Удалить</button></td></tr>').join('')+'</tbody></table></div>';
 $('#cAdd').onclick=()=>{const d=$('#cDate').value,n=$('#cName').value.trim(),k=$('#cKind').value;
  if(!d||!n){$('#cErr').textContent='Укажите дату и наименование';return}if(holidayOf(d)){$('#cErr').textContent='Эта дата уже есть в календаре';return}
  S.holidays.push({date:d,name:n,kind:k});log('Изменение календаря',fmtD(d),'',k+': '+n);save();admCalendar();toast('День добавлен','ok')};
 $('#cLoad').onclick=()=>{let n=0;for(const h of holidaysFor(y+1))if(!holidayOf(h.date)){S.holidays.push(h);n++}log('Загрузка производственного календаря',String(y+1),'','добавлено дней: '+n);save();admCalendar();toast(n?'Загружено дней: '+n:'Календарь на '+(y+1)+' уже загружен')};
 $$('#adm [data-del]').forEach(b=>b.onclick=()=>{const h=holidayOf(b.dataset.del);S.holidays=S.holidays.filter(x=>x!==h);log('Изменение календаря',fmtD(h.date),h.kind+': '+h.name,'удалено');save();admCalendar()});
}
function admIntegrations(){
 const stale=skudStale();const lu=new Date(S.skud.last);
 const card=(title,ok,rows,btn,extra)=>'<div class="card"><h3>'+title+' '+(ok?'<span class="tag ok">работает</span>':'<span class="tag err">ошибка</span>')+'</h3><dl class="kv">'+rows.map(r=>'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>').join('')+'</dl>'+btn+(extra||'')+'</div>';
 $('#adm').innerHTML='<div class="page-h"><h2>Статус интеграций</h2></div><div class="integ">'+
 card('СКУД',!stale,[['Данные','события прохода (вход/выход)'],['Способ','REST API СКУД'],['Частота','каждые 5 минут + по кнопке'],['Последняя успешная',lu.toLocaleString('ru-RU')],['Ошибки',S.skud.errors.length?esc(S.skud.errors[0]):'нет']],
  '<div class="row"><button class="btn btn-primary" data-sync="skud">Синхронизировать</button><button class="btn" id="simFail">'+(S.skud.fail?'Восстановить СКУД (демо)':'Имитировать сбой СКУД (демо)')+'</button></div>')+
 card('1С:ЗУП — сотрудники и структура',true,[['Данные','сотрудники, должности, подразделения'],['Способ','HTTP-сервис / OData'],['Частота','1 раз в сутки (ночью)'],['Последняя успешная',esc(S.sync.hr)],['Сотрудников ЦУ',EMPS.length]],'<button class="btn btn-primary" data-sync="hr">Синхронизировать</button>')+
 card('1С:ЗУП — отсутствия',true,[['Данные','больничные, отпуска, командировки, прочее'],['Способ','HTTP-сервис / OData'],['Частота','каждый час'],['Последняя успешная',esc(S.sync.abs)]],'<button class="btn btn-primary" data-sync="abs">Синхронизировать</button>')+
 card('Active Directory',true,[['Данные','аутентификация, группы ролей'],['Способ','Kerberos / LDAP (Windows SSO)'],['Группы','MILK_Storekeeper, MILK_Admin, MILK_Viewer'],['Последняя проверка',esc(S.sync.ad)]],'<button class="btn btn-primary" data-sync="ad">Проверить</button>')+
 '</div>';
 $$('#adm [data-sync]').forEach(b=>b.onclick=()=>{const k=b.dataset.sync;const nm={skud:'СКУД',hr:'1С:ЗУП — сотрудники и структура',abs:'1С:ЗУП — отсутствия',ad:'Active Directory'}[k];
  if(k==='skud'){if(S.skud.fail){S.skud.errors.unshift(stamp()+' — ошибка запроса к API СКУД (таймаут)');log('Ошибка синхронизации','СКУД','','таймаут');save();admIntegrations();renderTop();toast('СКУД не отвечает','err');return}S.skud.last=Date.now();S.skud.notified=false}
  else S.sync[k]=stamp().slice(0,16);
  log('Ручной запуск синхронизации',nm,'','успешно');save();admIntegrations();renderTop();toast('Синхронизация выполнена: '+nm,'ok')});
 $('#simFail').onclick=()=>{if(S.skud.fail){S.skud.fail=false;S.skud.last=Date.now();S.skud.notified=false;log('Восстановление СКУД','СКУД','ошибка','работает','','Система');toast('СКУД восстановлен','ok')}
  else{S.skud.fail=true;S.skud.last=Date.now()-31*60000;S.skud.errors.unshift(stamp()+' — API СКУД недоступен (HTTP 503)');log('Ошибка синхронизации','СКУД','','HTTP 503','','Система');checkSkudFailure();toast('Сбой СКУД сымитирован','err')}
  save();admIntegrations();renderTop()};
}
let jLimit=100;
function admJournal(){
 const usersL=[...new Set(S.journal.map(j=>j.user))].sort();const acts=[...new Set(S.journal.map(j=>j.action))].sort();
 $('#adm').innerHTML='<div class="page-h"><h2>Журнал действий</h2><span class="muted small">записи не удаляются · хранение 3 года</span></div>'+
 '<div class="panel"><div class="row"><label class="field"><span>Пользователь</span><select class="input" id="jU"><option value="">Все</option>'+usersL.map(u=>'<option>'+esc(u)+'</option>').join('')+'</select></label>'+
 '<label class="field"><span>Действие</span><select class="input" id="jA"><option value="">Все</option>'+acts.map(a=>'<option>'+esc(a)+'</option>').join('')+'</select></label>'+
 '<label class="field" style="flex:1 1 220px"><span>Поиск</span><input class="input" type="search" id="jQ" placeholder="ФИО, таб. №, объект"></label></div></div><div id="jOut"></div>';
 const upd=()=>{const u=$('#jU').value,a=$('#jA').value,q=$('#jQ').value.trim().toLowerCase();
  const list=S.journal.filter(j=>(!u||j.user===u)&&(!a||j.action===a)&&(!q||(j.object+' '+j.newv+' '+j.oldv).toLowerCase().includes(q))).sort((x,y)=>x.ts<y.ts?1:x.ts>y.ts?-1:0);
  $('#jOut').innerHTML='<p class="muted small">Найдено записей: '+list.length+'</p><div class="tablewrap"><table><thead><tr><th>Дата и время</th><th>Пользователь</th><th>Действие</th><th>Объект</th><th>Было</th><th>Стало</th></tr></thead><tbody>'+
  (list.slice(0,jLimit).map(j=>'<tr><td class="tabno" style="white-space:nowrap">'+esc(j.ts.slice(0,10).split('-').reverse().join('.')+' '+j.ts.slice(11))+'</td><td>'+esc(j.user)+'</td><td>'+esc(j.action)+'</td><td>'+esc(j.object)+'</td><td class="muted">'+esc(j.oldv)+'</td><td>'+esc(j.newv)+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">Нет записей</td></tr>')+'</tbody></table></div>'+
  (list.length>jLimit?'<p><button class="btn" id="jMore">Показать ещё</button></p>':'');
  const m=$('#jMore');if(m)m.onclick=()=>{jLimit+=200;upd()}};
 ['jU','jA'].forEach(id=>$('#'+id).onchange=()=>{jLimit=100;upd()});$('#jQ').oninput=()=>{jLimit=100;upd()};upd();
}

/* ================= start ================= */
S=load();if(S)reindex();else initState();
render();
// автообновление СКУД каждые 5 минут, проверка «устаревания» каждую минуту
setInterval(()=>{if(!S.skud.fail&&Date.now()-S.skud.last>=5*60000){S.skud.last=Date.now();save()}
 const r=route();renderTop();if(r.page==='issue'&&!$('.overlay')&&!$('.combo-panel:not([hidden])')&&document.activeElement!==$('#q'))renderIssue();},60000);
})();
</script>
